description: >-
  Reads the most recent unread messages in a mailbox, summarizes each one in a
  sentence, folds them into one digest, and posts that digest to a chat channel.
  Absorbs discord-notify: summarizing and posting were always run as a pair.
  Read-only on the mailbox: unread stays unread, nothing is moved or flagged.

resources:                     # what this skill needs, bound to an instance at install
  inbox: test/email/imap
  notify: test/discord/channel

input:
  type: object
  properties:
    limit:                     # how many of the most recent unread to digest
      type: integer
      minimum: 1
      default: 10              # a digest, not the whole backlog

output:
  type: object
  properties:
    digest: { type: string }
    id: { type: string }       # the posted message's id
  required: [digest, id]

entry: list

nodes:
  - id: list
    type: tool
    resource: inbox
    call: fetch                # this skill's name for it; the install says which tool
    args:
      unread: true             # UNSEEN only — the read backlog is not news
      limit: $.input.limit

  - id: summaries              # map: one child run per id, output is the list
    type: skill.run
    for_each: $.list.ids
    resources:
      inbox: inbox             # the child gets the instance, never a credential
    input:
      message_id: $.each
    out:
      type: array
      items:
        type: object
        properties:
          subject: { type: string }
          summary: { type: string }
        required: [subject, summary]
    graph:
      description: Fetches one message by id and summarizes it in a sentence.
      resources: [inbox]         # by name; the node above says which instance
      input:
        type: object
        properties:
          message_id: { type: string }
        required: [message_id]
      output:
        type: object
        properties:
          subject: { type: string }
          summary: { type: string }
        required: [subject, summary]
      entry: fetch
      nodes:
        - id: fetch
          type: tool
          resource: inbox
          call: read             # BODY.PEEK under the hood, so reading leaves it unread
          args:
            id: $.input.message_id

        - id: summarize
          type: llm
          prompt: |
            Summarize this e-mail in one sentence.

            From: {{ $.fetch.sender }}
            Subject: {{ $.fetch.subject }}

            {{ $.fetch.body }}
          out:
            type: object
            properties:
              summary: { type: string }
            required: [summary]
      edges:
        - { from: fetch,     to: summarize }
        - { from: summarize, to: end }
      return:
        subject: $.fetch.subject
        summary: $.summarize.summary

  - id: digest                 # reduce: the summaries, combined into one chat message
    type: llm
    prompt: |
      These are today's unread e-mails, one line each.
      Write a short digest for a chat channel: what needs attention, what can wait.
      Keep it under 1500 characters — the channel truncates at 2000.
      If the list is empty, say the inbox is clear.

      {{ $.summaries }}
    out:
      type: object
      properties:
        digest: { type: string }
      required: [digest]

  - id: post
    type: tool
    resource: notify
    call: send                 # this skill's name for it; the install says which tool
    args:
      content: $.digest.digest

edges:
  - { from: list,      to: summaries }
  - { from: summaries, to: digest }
  - { from: digest,    to: post }
  - { from: post,      to: end }

return:
  digest: $.digest.digest
  id: $.post.id
