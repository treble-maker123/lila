# LILA install config. Copy to .lila/config.toml and edit.
#
# An install is a `.lila/` directory — config, plus two trees installed into it:
#
#   .lila/
#     config.toml
#     adapters/test/email/code/imap.py
#     skills/test/email-digest/skill.yaml
#
# An adapter is a resource type and the tools over it, and stays a leaf. A skill is one
# graph, and is the only thing allowed to use more than one adapter — which is why it
# lives in its own tree rather than inside one. Neither has a manifest: a directory is
# an adapter iff it holds `code/`, a skill iff it holds `skill.yaml`, and where it sits
# is what it is called. `<namespace>/<name>` in both trees, so a skill is
# `test/email-digest` and a resource type `test/email/imap`. Nothing carries a version:
# installing is a `git clone` of a namespace, and git already versions it.
#
# The resolver searches the install first, then what ships with the harness. Commands
# find the install by walking up from the working directory, so they work from anywhere
# in the tree; $LILA_HOME or --home overrides. A skill can then be named by ref rather
# than pathed, or by what this install calls its copy of it:
#
#   lila call gmail-personal.list_messages --arg unread=true
#   lila run morning-digest
#
# A skill file is portable: it names a model alias and its own name for each resource it
# needs, never an endpoint, a credential, or a folder on your disk. This file is the
# local half — it says what those names point at here. Nothing in it reaches a prompt or
# the run record.


# --- models -------------------------------------------------------------------------
# A graph says `model: default` (or omits it, which means the same). The alias is bound
# here, so moving a skill to another machine cannot drag a model choice along with it.
#
#   model           the backend's own id, e.g. what `ollama list` shows
#   backend         only "ollama" today; the seam for the bundled runtime later
#   host            where that backend listens
#   context_length  tokens of context to allocate
#
# context_length is set here, not in a skill, because it is a property of the machine
# and the model rather than of the workflow — a skill that demanded 32k would break on a
# smaller box. SET IT: ollama defaults to 2048 and truncates silently past that, which
# looks like a model that cannot read rather than a prompt that was cut off.
#
# Sizing it: `ollama show <model>` gives the model's own maximum (qwen3.5:9b: 262144),
# but the real limit is memory. The KV cache is allocated up front, so on a 16 GB
# machine qwen3.5:9b measures 5.6 GB resident at 8192 and 6.5 GB at 32768 — roughly
# 0.9 GB per extra 32k. 32768 leaves ~25k tokens of usable prompt, which is far below
# where a long-context model degrades and comfortably fits a large HTML e-mail.
# Prefill cost grows with prompt length too, so headroom you rarely use is free but
# a prompt that actually fills it is not.

[models.default]
model = "qwen3.5:9b"
host = "http://localhost:11434"
context_length = 32768


# --- resources ----------------------------------------------------------------------
# One configured instance. `type` is a resource type an installed adapter defines,
# written `<namespace>/<adapter>/<type>`; the adapter's own dataclass decides which
# other keys are meaningful, and an unknown or missing one fails at load.
#
# Secrets are NOT written here. `secrets` maps a setting to the environment variable
# holding its value, read when the resource is built. That keeps this file safe to read
# and to copy around, and it is the seam that a keychain or an encrypted store replaces
# later without touching any adapter.
#
# test/email/imap settings: host, username, folder (default "INBOX"),
#                           port (default 993), password (via secrets)
#
# Gmail: turn on 2FA, create an app password at myaccount.google.com/apppasswords, and
# enable IMAP in Gmail → Settings → Forwarding and POP/IMAP. Labels are folders here.

[resources.gmail-personal]
type = "test/email/imap"
host = "imap.gmail.com"
username = "you@gmail.com"
folder = "INBOX"
secrets = { password = "LILA_INBOX_PASSWORD" }

# test/discord/channel settings: channel_id, api_base (default the v10 API),
#                                token (via secrets)
#
# Outbound only — the bot posts, it does not read. Create an application at
# discord.com/developers, add a bot, copy its token, invite it to the server with the
# Send Messages permission, then turn on developer mode in Discord and right-click the
# channel → Copy Channel ID.

[resources.discord-alerts]
type = "test/discord/channel"
channel_id = "000000000000000000"
secrets = { token = "LILA_DISCORD_TOKEN" }


# --- skills -------------------------------------------------------------------------
# A skill is a template; this is where the install stamps out a copy of one and says
# what it runs against. `name` is yours and is the run target — `lila run morning-digest`
# — so an upstream rename cannot silently unbind anything; it shows up as a `source` that
# resolves to nothing. The same skill can be instantiated twice, bound differently.
#
# `source` is the skill's ref: where it sits under `skills/`. `enabled` parses and prints
# but gates nothing yet — nothing runs skills on its own.
#
# `resources.<name>` binds one resource the skill declares (`resources: inbox:
# test/email/imap`) to the [resources] instance that fills it. A skill refuses to run
# until each is bound. Two instantiations can point `inbox` at different mailboxes, and
# one skill can declare two resources — read from `inbox`, post to `notify`.
#
# `tools` maps the skill's own call names to the tools the instance really has. A skill
# file says `call: fetch` and never `call: list_messages`, so it carries no name an
# adapter owns: an adapter renaming a tool is one line to fix here, in your own config,
# rather than an edit to someone else's repo. The map is also the whole grant — a tool
# not listed cannot be reached through this resource — and it must cover every call the
# skill makes, including the ones its inline subgraphs make.
#
# These are dotted keys *inside* the [[skill]] block, not [skill.inbox] headers: a
# separate header attaches to whichever [[skill]] came last, so moving it silently
# rebinds it to another skill. One line per resource, an inline table each.
#
# A resource with several keys can expand to one dotted line per key instead —
# `resources.inbox.instance = "gmail-personal"`. Both forms parse the same and mix
# across resources, but never within one: an inline `resources.inbox = { ... }`
# followed by `resources.inbox.instance = ...` is a TOML redefinition error, and the
# message will not mention skills.

# Two resources — this is what the split buys: the skill reads from one adapter and
# posts to another, and neither adapter knows the other exists. Note that both this
# skill and the one below call something `fetch` or `send`; the names are each skill's
# own, so they collide with nothing.

[[skill]]
name = "morning-digest"
source = "test/email-digest"
enabled = true
resources.inbox.instance    = "gmail-personal"
resources.inbox.tools.fetch = "list_messages"
resources.inbox.tools.read  = "get_message"   # the inline subgraph's call
resources.notify = { instance = "discord-alerts", tools = { send = "post_message" } }

[[skill]]
name = "deploy-notes"
source = "test/discord-notify"
resources.alerts = { instance = "discord-alerts", tools = { send = "post_message" } }
