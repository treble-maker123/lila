[project]
name = "loop_workflow_comparison_experiment"
version = "0.1.0"
description = "Experiment harness: ReAct loop vs graph workflow on email triage, local 9B"
requires-python = ">=3.13"
dependencies = [
    "click",
    "pydantic",
    "ollama",
    "httpx",
    "rich",
    "beautifulsoup4",
    "scipy",
    "marimo",
]

[project.scripts]
loop-workflow-comparison = "loop_workflow_comparison.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_workflow_comparison"]

