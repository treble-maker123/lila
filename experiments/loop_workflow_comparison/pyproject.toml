[project]
name = "email-organization"
version = "0.1.0"
description = "Experiment harness: ReAct loop vs graph workflow on email triage, local 9B"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "ollama>=0.3",
    "httpx>=0.27",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "scipy>=1.14",
]

[project.scripts]
email-org = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

