      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

2014\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_out_post\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u2014\u003C/td\u003E\n\u003Ctd\u003E\u2014\u003C/td\u003E\n\u003Ctd\u003E\u2014\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ewall_clock_ms\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E955,418 ms (955.4 s)\u003C/td\u003E\n\u003Ctd\u003E620,983 ms (621.0 s)\u003C/td\u003E\n\u003Ctd\u003E\u00d70.65\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Epeak_context_tokens\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E2,736\u003C/td\u003E\n\u003Ctd\u003E1,923\u003C/td\u003E\n\u003Ctd\u003E\u00d70.70\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ememory\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E5,453 MB (92 MB KV)\u003C/td\u003E\n\u003Ctd\u003E5,425 MB (65 MB KV)\u003C/td\u003E\n\u003Ctd\u003E\u00d70.99\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInput tokens by call role\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EThis results file predates call-role bucketing; re-run to populate.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E\u003Ccode\u003Efetch\u003C/code\u003E is free for the graph \u2014 it dispatches \u003Ccode\u003Eget_new_email\u003C/code\u003E in code \u2014 so the headline input-token gap shrinks a lot once that row is set aside. Note the call counts: excluding fetch, the graph can make more calls than the loop and still spend fewer tokens, because its prompts neither carry seven tool schemas nor re-send a transcript.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ETokens and time sum across every email of every run; \u003Ccode\u003Epeak_context_tokens\u003C/code\u003E and \u003Ccode\u003Ememory\u003C/code\u003E take the \u003C/em\u003E\u003Cem\u003Emax\u003C/em\u003E\u003Cem\u003E \u2014 a setup needs its worst email, not the total. The ratio column compares the last setup to the first.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhat these count\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EMetric\u003C/th\u003E\n\u003Cth\u003ECounts\u003C/th\u003E\n\u003Cth\u003ECaveat\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_in_cumulative\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eevery call's prompt, summed\u003C/td\u003E\n\u003Ctd\u003EA loop re-sends its conversation each turn, so an N-turn loop counts the shared prefix N times. What an uncached, per-call-billed API charges; \u003Cstrong\u003Eoverstates\u003C/strong\u003E the loop locally, where the KV cache avoids the re-reading\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_in_unique\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eeach prompt token once\u003C/td\u003E\n\u003Ctd\u003EFor the loop, just the final call's prompt \u2014 the message list only grows, so every earlier prompt is a prefix of it. The graph's two node prompts lead with the same email block, which is counted once. \u003Cstrong\u003EUnderstates\u003C/strong\u003E the loop\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Einput-token gap\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecumulative \u2212 unique\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EInput a perfect prefix cache would not re-evaluate: the loop's re-sent transcript, the graph's shared email block\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_out\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Egenerated tokens\u003C/td\u003E\n\u003Ctd\u003E\u2014\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_out_pre\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eprose generated before the tool call\u003C/td\u003E\n\u003Ctd\u003EThe only generated tokens that can steer the route \u2014 the model conditions its choice on them. A loop writes these; a graph node emits the tool call with no prose at all\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_out_post\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe tool call itself: name and arguments\u003C/td\u003E\n\u003Ctd\u003EDraft, actions or reason. Emitted after the tool name, so it cannot change the route \u2014 a cost, not a decision. Estimated when one call mixed prose and a tool call (\u003Ccode\u003Etokens_out_split\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ewall_clock_ms\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etime in the scored region\u003C/td\u003E\n\u003Ctd\u003ERough. The model is warmed up first so load time doesn't land on email #1 alone (\u003Ccode\u003E--no-warm-up\u003C/code\u003E to disable)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Epeak_context_tokens\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EKV occupancy in tokens: \u003Ccode\u003Emax\u003C/code\u003E over calls of prompt + generated\u003C/td\u003E\n\u003Ctd\u003EWhat must be resident at once, not what was processed. The loop's grows with its transcript; the graph's is its largest single node\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ememory\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethat peak in bytes: \u003Ccode\u003Ekv_bytes\u003C/code\u003E + \u003Ccode\u003Eweights_bytes\u003C/code\u003E = \u003Ccode\u003Etotal_bytes\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EWeights are equal across setups, so the difference is all \u003Ccode\u003Ekv_bytes\u003C/code\u003E. Null if calibration failed\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EReport both input-token numbers; the gap between them is the loop's re-reading overhead.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "ac542b9bd254dc3a674cfe6c125180cf", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "dc26f6358578a104248a211e8cca7291", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d36534107dc1e710931939851a469c5a", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f8cf5ccb39cbb5aaf219187f87822317", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "38b922e0f27d2cef226f1293ba95b4b7", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch2 id=\u0026#92;\u0026quot;labels\u0026#92;\u0026quot;\u0026#92;u003eLabels\u0026#92;u003c/h2\u0026#92;u003e\u0026#92;u003 E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EBoth \u003Ccode\u003Ecorrect / emails\u003C/code\u003E and \u003Ccode\u003Ecorrect / decided\u003C/code\u003E are worth reading: the first is the headline, the second separates routing quality from failing to terminate. An \u003Ccode\u003Eerror\u003C/code\u003E is never correct.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003Epass^k\u003C/strong\u003E \u2014 all k of k runs correct\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Ek\u003C/th\u003E\n\u003Cth\u003E1: ReAct local\u003C/th\u003E\n\u003Cth\u003E2: Graph local\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E1\u003C/td\u003E\n\u003Ctd\u003E0.760\u003C/td\u003E\n\u003Ctd\u003E0.840\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003E\u003Ccode\u003Epass^1\u003C/code\u003E is exactly the mean of \u003Ccode\u003Ecorrect / emails\u003C/code\u003E, so the decay from it is instability, not accuracy. Needs \u003Ccode\u003E--runs\u003C/code\u003E \u2265 2 to say anything.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhat these count\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EMetric\u003C/th\u003E\n\u003Cth\u003ECalculation\u003C/th\u003E\n\u003Cth\u003EAcross runs\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecorrect\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eper run, over all emails; an \u003Ccode\u003Eerror\u003C/code\u003E is never correct\u003C/td\u003E\n\u003Ctd\u003Emean / min / max / stdev\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emajority_correct\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eper email, whether the most common answer across runs matches the label\u003C/td\u003E\n\u003Ctd\u003Esingle number\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edecided\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eper run; emails \u2212 errors. Denominator for routing quality with robustness factored out\u003C/td\u003E\n\u003Ctd\u003Emean / min / max / stdev\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etp\u003C/code\u003E / \u003Ccode\u003Efp\u003C/code\u003E / \u003Ccode\u003Efn\u003C/code\u003E / \u003Ccode\u003Etn\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eper run, per class, one-vs-rest; \u003Ccode\u003Eerror\u003C/code\u003E predictions count against every class\u003C/td\u003E\n\u003Ctd\u003Esummed\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Epass^k\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eper email, how many of the runs matched the label\u003C/td\u003E\n\u003Ctd\u003Ecurve over k = 1\u2026runs\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Ecorrect\u003C/code\u003E and \u003Ccode\u003Epass^k\u003C/code\u003E are two margins of one emails \u00d7 runs matrix: \u003Ccode\u003Ecorrect\u003C/code\u003E reads a\nrow (one run, every email), \u003Ccode\u003Epass^k\u003C/code\u003E a column (one email, right \u003Cem\u003Eall\u003C/em\u003E k times \u2014\n\u03c4-bench's sense, not best-of-k), estimated over \u003Ccode\u003En\u003C/code\u003E runs with \u003Ccode\u003Ec\u1d62\u003C/code\u003E correct on email \u003Cem\u003Ei\u003C/em\u003E\nas \u003Ccode\u003Epass^k = (1/emails) \u00b7 \u03a3\u1d62 C(c\u1d62, k) / C(n, k)\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Emajority_correct\u003C/code\u003E is the opposite bound \u2014 \u003Ccode\u003Epass^n\u003C/code\u003E is the setup unaided, majority is it\nwith n-way voting on top. An email right in 2 of 3 runs gives 0.67 to mean \u003Ccode\u003Ecorrect\u003C/code\u003E, 0\nto \u003Ccode\u003Epass^3\u003C/code\u003E, 1 to \u003Ccode\u003Emajority_correct\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAt 40 emails gaps under ~8 points are noise, and \u003Ccode\u003Epass^k\u003C/code\u003E is the noisiest here.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"counts-by-class-and-category\"\u003ECounts by class and category\u003C/h3\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ECounted on two axes: per \u003Ccode\u003Enext_step\u003C/code\u003E class (is \u003Ccode\u003Eno_action\u003C/code\u003E over-emitted? are \u003Ccode\u003Eflag_for_human\u003C/code\u003E emails buried?) and per \u003Ccode\u003Ecategory\u003C/code\u003E, which shows the email shapes that break without needing new labels. Summed across runs.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space yle=\"text-align: right;\"\u003E50\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EMcNemar exact, two-sided, on the 12 discordant emails (4 + 8). \u003Cstrong\u003Ep = 0.388\u003C/strong\u003E \u2014 the 4:8 split is within what coin flips produce, so this run does not separate the two setups.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhich emails split them\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ERight on\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003En\u003C/th\u003E\n\u003Cth\u003Eemails\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E1: ReAct local only\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E4\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ee015\u003C/code\u003E, \u003Ccode\u003Ee018\u003C/code\u003E, \u003Ccode\u003Ee022\u003C/code\u003E, \u003Ccode\u003Ee048\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E2: Graph local only\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E8\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ee019\u003C/code\u003E, \u003Ccode\u003Ee020\u003C/code\u003E, \u003Ccode\u003Ee027\u003C/code\u003E, \u003Ccode\u003Ee029\u003C/code\u003E, \u003Ccode\u003Ee031\u003C/code\u003E, \u003Ccode\u003Ee036\u003C/code\u003E, \u003Ccode\u003Ee041\u003C/code\u003E, \u003Ccode\u003Ee043\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eneither\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E4\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ee009\u003C/code\u003E, \u003Ccode\u003Ee010\u003C/code\u003E, \u003Ccode\u003Ee023\u003C/code\u003E, \u003Ccode\u003Ee024\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EBoth setups see the same emails, so the comparison is paired and the two accuracy figures are not independent samples. Comparing them as if they were overstates the evidence: only the emails the setups disagree on carry any, and at 50 emails there are rarely many. The concordant cells are excluded for that reason, not by oversight.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EThe two columns bracket the same runs: \u003Ccode\u003Emajority\u003C/code\u003E is each setup with n-way voting on top, \u003Ccode\u003Epass^n\u003C/code\u003E is each setup unaided and asked to be right every time. A gap that only opens under \u003Ccode\u003Epass^n\u003C/code\u003E is a consistency gap, not an accuracy one. Only k = n is tested \u2014 for k \u0026lt; n the per-email \u003Ccode\u003Epass^k\u003C/code\u003E is \u003Ccode\u003EC(c\u1d62,k)/C(n,k)\u003C/code\u003E, an average over run subsets rather than the binary outcome McNemar pairs on.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ERead the discordant emails in the deep dive below before trusting the headline gap \u2014 an item whose gold route is not derivable from \u003Ccode\u003EROUTING_POLICY\u003C/code\u003E scores as a coin flip, and a handful of those is the whole difference.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"does-one-setup-cost-more\"\u003EDoes one setup cost more?\u003C/h3\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EMetric\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003E1: ReAct local\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003E2: Graph local\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EA/B, median (95% CI)\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003Ep\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_in_unique\u003C/code\u003E\u003Cbr/\u003E\u003Csub\u003Eeach prompt token once \u2014 perfect-cache floor\u003C/sub\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1,794\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1,308\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u00d71.37 (1.34\u20131.41)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.0000\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_in_cumulative\u003C/code\u003E\u003Cbr/\u003E\u003Csub\u003Eevery call's prompt summed \u2014 no-cache ceiling\u003C/sub\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E3,934\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E2,308\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u00d71.53 (1.34\u20131.68)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.0000\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_in_no_fetch\u003C/code\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u2014\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u2014\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u2014\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u2014\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etokens_out\u003C/code\u003E\u003Cbr/\u003E\u003Csub\u003Egenerated tokens\u003C/sub\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E280\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E103\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u00d72.59 (2.27\u20132.96)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.0000\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ewall_clock_ms\u003C/code\u003E\u003Cbr/\u003E\u003Csub\u003Etime in the scored region\u003C/sub\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E19,108\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E12,420\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u00d71.44 (1.31\u20131.61)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.0000\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eread_tool_calls\u003C/code\u003E\u003Cbr/\u003E\u003Csub\u003Econtext the setup bought\u003C/sub\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E-0 (-1\u2013-0)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u2014\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Epeak_context_tokens\u003C/code\u003E\u003Cbr/\u003E\u003Csub\u003Elargest single prompt + generation\u003C/sub\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1,999\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1,353\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u00d71.48 (1.44\u20131.52)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E\u2014\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EPer-email means over the runs, paired and compared with Wilcoxon signed-rank. Paired because both setups see the same emails, which removes the between-email variance an XL email carries in both columns; signed-rank rather than a t-test because cost is right-skewed \u2014 a loop that wanders for six turns is a long tail. The estimate is the Hodges\u2013Lehmann median difference, on the log scale where every value is positive, so it reads as a ratio: \u00d71.00 is parity, below 1 means the first setup spends less.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EThe first three rows bracket the same input tokens. \u003Ccode\u003Etokens_in_unique\u003C/code\u003E assumes a perfect cache serves repeats for free; \u003Ccode\u003Etokens_in_cumulative\u003C/code\u003E assumes no cache at all. A real API charges cache reads at a fraction of the input rate and cache writes at a premium, so a bill sits between them \u2014 and locally, where the KV cache already avoids the re-reading, neither is money and \u003Ccode\u003Ewall_clock_ms\u003C/code\u003E is the metric that costs anything. \u003Ccode\u003Etokens_in_no_fetch\u003C/code\u003E is the control-flow-clean one: setup 2 dispatches \u003Ccode\u003Eget_new_email\u003C/code\u003E in code, so excluding that role stops the comparison crediting the graph for an implementation choice. Agreement across all three is the claim worth making; disagreement says the gap is caching policy, not control flow.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EThe p-values answer 'is there a difference at all', which a large consistent gap makes a foregone conclusion \u2014 read the ratio and its interval first. Untested rows are reported for context only; they correlate with the tested ones, and pricing every correlated metric would buy multiplicity rather than information.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "df37c7d5f3551ac766ad6024da837839", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3f9dff531affa9956adaa5df157f1f03", "console": [], "id": "Hstk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a29c5c5e5d50adf4f839b0f5c86515a9", "console": [], "id": "nWHF", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4fb90c14695aaa1b9ba747e4be86d5e3", "console": [], "id": "iLit", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "40c3a62a858aaa2490349958f1969ce9", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "dfc1aa87f3e5309ccfb04e5e4a5384ef", "console": [], "id": "ROlb", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch2 id=\u0026#92;\u0026quot;deep-dive\u0026#92;\u0026quot;\u0026#92;u003eDeep dive\u0026#92;u003c/h2\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EEditor-only. Run \u003Ccode\u003Emake notebook\u003C/code\u003E to open it.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": null, "console": [], "id": "qnkX", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.16", "script_metadata_hash": null}, "version": "1"},
