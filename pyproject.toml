[project]
name = "lila"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["experiments/loop_workflow_comparison", "src/core"]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "basedpyright",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lila", "loop_workflow_comparison"]

# Pylance reads this too, so the editor and `make typecheck` agree.
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]
