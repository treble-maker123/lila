[project]
name = "lila-core"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["httpx"]

[project.scripts]
lila = "lila.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lila"]

[tool.pytest.ini_options]
# tst/ is unit tests (no daemon, no network); integ/ needs a live ollama.
testpaths = ["tst"]
asyncio_mode = "auto"