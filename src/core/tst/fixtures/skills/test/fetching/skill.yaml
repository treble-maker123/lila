description: Fetches one message by id and returns its subject.

resources:
  inbox: test/fixture/mailbox

input:
  type: object
  properties:
    message_id: { type: string }
  required: [message_id]

entry: fetch

nodes:
  - id: fetch
    type: tool
    resource: inbox
    call: read
    args: { id: $.input.message_id }

edges:
  - { from: fetch, to: end }

return:
  subject: $.fetch.subject
